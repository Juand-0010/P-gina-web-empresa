<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1024">
  <title>Redes sociales | Servicios TI y Analítica</title>
  <style>
    :root{--ink:#f7f7ff;--muted:#bec2de;--violet:#8b6cff;--aqua:#5ae6dc;--bg:#0b1024;--card:rgba(18,25,57,.65)}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.ambient,.ambient:before,.ambient:after{position:fixed;inset:0;pointer-events:none}.ambient{background:radial-gradient(circle at 15% 15%,rgba(112,79,255,.32),transparent 28%),radial-gradient(circle at 82% 76%,rgba(34,212,194,.2),transparent 26%),linear-gradient(135deg,#090d21 0%,#14113a 54%,#081b2c 100%)}.ambient:before,.ambient:after{content:"";filter:blur(55px);opacity:.75;animation:float 16s ease-in-out infinite}.ambient:before{inset:auto;left:-10vw;top:56vh;width:44vw;height:44vw;background:#6d4aff;border-radius:50%}.ambient:after{inset:auto;right:-10vw;top:-12vh;width:42vw;height:42vw;background:#20b9c8;border-radius:50%;animation-delay:-8s}@keyframes float{50%{transform:translate(8vw,-6vh) scale(1.17)}}.grid{position:fixed;inset:0;opacity:.2;background-image:linear-gradient(rgba(110,234,224,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(110,234,224,.10) 1px,transparent 1px);background-size:42px 42px;mask-image:radial-gradient(ellipse at center,black,transparent 76%);animation:drift 15s linear infinite}@keyframes drift{to{background-position:42px 42px}}.card{position:relative;width:min(620px,calc(100% - 42px));padding:clamp(34px,7vw,70px);border:1px solid rgba(255,255,255,.14);border-radius:32px;background:var(--card);box-shadow:0 28px 90px rgba(0,0,0,.24);backdrop-filter:blur(22px);text-align:center;animation:enter .7s cubic-bezier(.16,.8,.22,1) both}@keyframes enter{from{opacity:0;transform:translateY(35px) scale(.97);filter:blur(7px)}to{opacity:1;transform:none;filter:none}}.symbol{width:64px;height:64px;margin:0 auto 28px;border-radius:21px;display:grid;place-items:center;background:linear-gradient(135deg,var(--violet),var(--aqua));color:#12152e;font-size:1.8rem;font-weight:900;box-shadow:0 14px 42px rgba(87,72,255,.42)}.eyebrow{font-size:.74rem;letter-spacing:.17em;text-transform:uppercase;color:var(--aqua);font-weight:800}.eyebrow:before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--violet);margin-right:12px;box-shadow:0 0 16px var(--violet)}h1{font-size:clamp(2.5rem,7vw,5rem);letter-spacing:-.06em;line-height:.96;margin:24px 0 18px}p{font-size:1.12rem;line-height:1.55;color:var(--muted);margin:0 auto;max-width:440px}.back{display:inline-flex;margin-top:34px;padding:13px 19px;border:1px solid rgba(255,255,255,.18);border-radius:14px;color:var(--ink);text-decoration:none;background:rgba(255,255,255,.08);transition:.2s}.back:hover{transform:translateY(-2px);background:var(--violet);color:white}body.light{--ink:#18213c;--muted:#52617c;--violet:#6854d8;--aqua:#087e83;--bg:#f3f6fb;--card:rgba(255,255,255,.78)}body.light .ambient{background:radial-gradient(circle at 15% 15%,rgba(117,95,238,.20),transparent 30%),radial-gradient(circle at 82% 76%,rgba(22,169,166,.16),transparent 28%),linear-gradient(135deg,#fbfcff 0%,#eef2ff 53%,#e8f7f7 100%)}body.light .ambient:before,body.light .ambient:after{opacity:.28}body.light .grid{opacity:.34}body.light .card{border-color:rgba(33,45,78,.13);box-shadow:0 28px 90px rgba(32,47,89,.12)}body.light .back{border-color:rgba(33,45,78,.16);background:rgba(255,255,255,.65)}
  </style>
</head>
<body>
  <div class="ambient"></div><div class="grid"></div>
  <main class="card"><div class="symbol">N</div><div class="eyebrow">Canales de contacto</div><h1>Redes sociales<br>próximamente.</h1><p>Aquí estarán las redes sociales de la empresa. Todavía no se han creado ni definido los canales oficiales.</p><a class="back" href="index.html">← Volver a la presentación</a></main>
  <script>if(localStorage.getItem('presentation-theme')==='light'){document.body.classList.add('light');document.querySelector('meta[name="theme-color"]').content='#f3f6fb'}</script>
</body>
</html>
