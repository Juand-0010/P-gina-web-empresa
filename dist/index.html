<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090a0d">
  <meta name="description" content="Presentación interactiva de Servicios TI y Analítica.">
  <title>Nexora — Servicios TI y Analítica</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23090a0d'/%3E%3Cpath d='M18 18h10l18 28H36zM36 18h10L28 46H18z' fill='white'/%3E%3C/svg%3E">
  <style>
    :root{--ink:#0b0c0f;--paper:#f7f7f5;--line:#e6e6e1;--blue:#2d5fff;--ease:cubic-bezier(.22,.8,.18,1)}*{box-sizing:border-box}html{background:#090a0d}body{margin:0;min-height:100vh;background:#090a0d;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
    body:before,body:after{content:"";position:fixed;pointer-events:none;inset:0;background-image:linear-gradient(rgba(255,255,255,.15) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.15) 1px,transparent 1px);background-size:28px 28px;mask-image:radial-gradient(circle at 50% 50%,black 5%,transparent 76%);opacity:.48}body:after{background:radial-gradient(circle at 50% 105%,rgba(58,92,255,.24),transparent 30%);mask-image:none;opacity:1}
    .site{position:relative;isolation:isolate;display:grid;grid-template-rows:auto 1fr;min-height:calc(100vh - 48px);max-width:1420px;margin:24px auto;border-radius:22px;background:var(--paper);overflow:hidden;box-shadow:0 32px 80px rgba(0,0,0,.42)}header{display:flex;align-items:center;justify-content:space-between;height:72px;padding:0 38px;border-bottom:1px solid var(--line);position:relative;z-index:10}.brand{display:flex;align-items:center;gap:9px;font-weight:760;letter-spacing:-.055em;font-size:1.04rem}.brand-mark{width:25px;height:25px;border-radius:9px;background:var(--ink);display:grid;place-items:center;color:#fff;font-size:.72rem;letter-spacing:-.12em}.brand span{font-weight:500;color:#53534f;font-size:.8rem;letter-spacing:0}nav{display:flex;gap:5px}button{font:inherit}.nav-button,.close{appearance:none;border:0;background:transparent;color:#4d4d48;font-size:.73rem;font-weight:650;cursor:pointer;padding:9px 12px;border-radius:99px;transition:.25s}.nav-button:hover,.nav-button:focus-visible{background:#e9e9e4;color:#090a0d;outline:0}.status{display:flex;align-items:center;gap:9px;font-size:.7rem;color:#6d6d67}.status i{width:7px;height:7px;border-radius:50%;background:#31ba71;box-shadow:0 0 0 4px #dff5e9}
    main{position:relative;min-height:0;overflow:hidden}.intro{position:absolute;z-index:3;top:clamp(38px,7vh,88px);left:50%;width:min(760px,90%);transform:translateX(-50%);text-align:center;pointer-events:none}.kicker{margin:0 0 15px;color:#73736e;text-transform:uppercase;letter-spacing:.17em;font-size:.66rem;font-weight:760}.intro h1{margin:0;font-size:clamp(2.6rem,5.4vw,5.75rem);line-height:.94;letter-spacing:-.075em;font-weight:760}.intro h1 em{font-style:normal;color:#6a6a64}.intro p{max-width:485px;margin:21px auto 0;color:#777771;font-size:clamp(.87rem,1.25vw,1.03rem);line-height:1.55}
    .deck-area{position:absolute;inset:0;top:205px;perspective:1500px;perspective-origin:50% 70%;cursor:default}.deck{position:absolute;inset:0;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transform-style:preserve-3d;transition:transform .18s ease-out}.deck:before{content:"";position:absolute;left:50%;bottom:clamp(-26px,-2vh,0px);width:min(780px,80vw);height:122px;transform:translateX(-50%);background:radial-gradient(ellipse,rgba(0,0,0,.18),transparent 68%);filter:blur(16px)}
    .card{--w:clamp(146px,16vw,220px);position:absolute;left:var(--x);bottom:clamp(7px,3.5vh,44px);width:var(--w);height:calc(var(--w) * 1.28);padding:8px;border:0;border-radius:17px;background:#fff;box-shadow:0 22px 30px rgba(24,24,22,.20);cursor:pointer;overflow:hidden;transform:translate(-50%,var(--y)) rotate(var(--r));transform-origin:50% 112%;transition:transform .58s var(--ease),box-shadow .4s var(--ease),filter .4s;animation:arrive .9s var(--ease) both;animation-delay:var(--delay);text-align:left;color:white}.card:focus-visible{outline:3px solid var(--blue);outline-offset:5px}.card img{width:100%;height:100%;object-fit:cover;border-radius:10px;display:block;filter:saturate(.96) contrast(1.04);transition:transform .7s var(--ease),filter .5s}.card:before{content:"";position:absolute;inset:8px;z-index:1;border-radius:10px;background:linear-gradient(180deg,transparent 30%,rgba(2,5,12,.1) 48%,rgba(2,5,12,.91) 100%)}.card:after{content:"";position:absolute;inset:8px;z-index:2;border:1px solid rgba(255,255,255,.16);border-radius:10px;opacity:0;transition:.35s}.card .number{position:absolute;z-index:3;top:20px;left:20px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.88);color:#0c0d10;font-size:.62rem;font-weight:800}.card .copy{position:absolute;z-index:3;right:18px;bottom:18px;left:18px}.card small{display:block;margin-bottom:5px;font-size:.55rem;font-weight:760;letter-spacing:.12em;text-transform:uppercase;opacity:.75}.card strong{display:block;font-size:clamp(.82rem,1.2vw,1.1rem);line-height:1.04;letter-spacing:-.04em}.card:hover,.card.active{z-index:8;transform:translate(-50%,calc(var(--y) - 62px)) rotate(0deg) scale(1.08);box-shadow:0 34px 45px rgba(14,17,31,.35)}.card:hover img,.card.active img{transform:scale(1.07);filter:saturate(1.1) contrast(1.08)}.card:hover:after,.card.active:after{opacity:1}@keyframes arrive{from{opacity:0;transform:translate(-50%,calc(var(--y) + 160px)) rotate(var(--r));filter:blur(8px)}to{opacity:1;filter:blur(0)}}.card:nth-child(1){--x:17%;--y:67px;--r:-21deg;--delay:.06s;z-index:1}.card:nth-child(2){--x:33.5%;--y:24px;--r:-10deg;--delay:.13s;z-index:2}.card:nth-child(3){--x:50%;--y:0px;--r:0deg;--delay:.2s;z-index:5}.card:nth-child(4){--x:66.5%;--y:24px;--r:10deg;--delay:.27s;z-index:3}.card:nth-child(5){--x:83%;--y:67px;--r:21deg;--delay:.34s;z-index:1}
    .instruction{position:absolute;z-index:4;left:50%;bottom:21px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;color:#74746e;font-size:.68rem;white-space:nowrap}.instruction b{display:grid;place-items:center;width:22px;height:22px;border:1px solid #d9d9d4;border-radius:7px;color:#333;font-size:.7rem}.desktop-only{display:inline}
    .detail{position:absolute;z-index:20;inset:0;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(300px,.95fr);background:var(--paper);opacity:0;visibility:hidden;transform:scale(.98);transition:opacity .45s var(--ease),transform .45s var(--ease),visibility 0s .45s}.detail.open{opacity:1;visibility:visible;transform:none;transition-delay:0s}.detail-visual{position:relative;overflow:hidden;background:#101216}.detail-visual img{width:100%;height:100%;object-fit:cover;opacity:.88}.detail-visual:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 45%,#f7f7f5),linear-gradient(0deg,rgba(2,4,9,.45),transparent 45%)}.detail-content{padding:clamp(32px,6vw,92px) clamp(27px,5vw,78px);display:flex;flex-direction:column;justify-content:center}.close{position:absolute;right:25px;top:22px;border:1px solid #deded8;color:#222;z-index:3}.close:hover{background:#111;color:#fff}.detail-index{color:#777771;letter-spacing:.15em;text-transform:uppercase;font-size:.66rem;font-weight:800}.detail h2{margin:18px 0;max-width:580px;font-size:clamp(2.5rem,5vw,5.6rem);line-height:.93;letter-spacing:-.077em}.detail p{margin:0;max-width:445px;color:#696964;font-size:1rem;line-height:1.63}.detail-list{display:grid;gap:11px;margin:30px 0 0;padding:0;list-style:none}.detail-list li{display:flex;gap:11px;align-items:flex-start;color:#31312e;font-size:.88rem;line-height:1.4}.detail-list i{flex:0 0 auto;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:#e6eaff;color:#2d5fff;font-style:normal;font-size:.7rem;font-weight:800}.detail-next{margin-top:38px;color:#50504b;font-size:.73rem;font-weight:700}.detail-next kbd{margin-left:6px;padding:4px 7px;border:1px solid #d8d8d3;border-radius:6px;background:#fff;font:inherit}
    @media(max-width:720px){body{overflow:auto}.site{min-height:calc(100svh - 24px);margin:12px;border-radius:18px}.site header{height:61px;padding:0 18px}.brand span,.status{display:none}nav{gap:0}.nav-button{font-size:.67rem;padding:8px 7px}.intro{top:clamp(42px,9vh,70px)}.intro h1{font-size:clamp(2.55rem,13.5vw,4.5rem)}.intro p{font-size:.83rem;max-width:290px}.deck-area{top:200px}.deck{transform:none!important}.card{--w:clamp(124px,40vw,172px);bottom:clamp(28px,8vh,58px);border-radius:14px;padding:6px}.card:nth-child(1){--x:7%;--y:54px;--r:-18deg}.card:nth-child(2){--x:28%;--y:20px;--r:-8deg}.card:nth-child(3){--x:50%;--y:0px}.card:nth-child(4){--x:72%;--y:20px;--r:8deg}.card:nth-child(5){--x:93%;--y:54px;--r:18deg}.card .copy{right:13px;bottom:12px;left:13px}.card .number{top:14px;left:14px}.card strong{font-size:.78rem}.card:hover,.card.active{transform:translate(-50%,calc(var(--y) - 32px)) rotate(0deg) scale(1.04)}.instruction{bottom:15px;font-size:.62rem}.desktop-only{display:none}.detail{grid-template-columns:1fr;grid-template-rows:33vh 1fr;overflow:auto}.detail-visual{min-height:0}.detail-content{padding:34px 25px 52px;justify-content:flex-start}.detail h2{font-size:clamp(2.5rem,13vw,4rem)}.detail p{font-size:.92rem}.detail-list{margin-top:20px}.detail-next{margin-top:25px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div class="site"><header><div class="brand"><b class="brand-mark">NX</b> Nexora <span>Servicios TI y Analítica</span></div><nav aria-label="Navegación"><button class="nav-button" data-nav="0">Inicio</button><button class="nav-button" data-nav="1">Servicios</button><button class="nav-button" data-nav="4">Equipo</button></nav><div class="status"><i></i> Cali, Colombia</div></header>
    <main><section class="intro" aria-labelledby="headline"><p class="kicker">Presentación interactiva · 2026</p><h1 id="headline">Tecnología que<br><em>mueve</em> la operación.</h1><p>Explora las cinco piezas de la propuesta. Cada una abre una parte del trabajo que hacemos.</p></section><section class="deck-area" id="deck-area" aria-label="Tarjetas de la presentación"><div class="deck" id="deck"></div></section><p class="instruction"><b>↗</b> Mueve el cursor <span class="desktop-only">o usa las flechas</span> · selecciona una tarjeta</p>
      <aside class="detail" id="detail" aria-live="polite" aria-hidden="true"><button class="close" id="close" aria-label="Cerrar detalle">Cerrar ✕</button><div class="detail-visual"><img id="detail-image" alt=""></div><div class="detail-content"><div class="detail-index" id="detail-index"></div><h2 id="detail-title"></h2><p id="detail-copy"></p><ul class="detail-list" id="detail-list"></ul><div class="detail-next">Siguiente tarjeta <kbd>→</kbd></div></div></aside>
    </main></div>
  <script>
    const cards=[
      {label:'Diagnóstico',title:'Entender antes de construir.',copy:'Partimos de la operación real: el proceso, las personas que lo usan y la información disponible. Así el alcance responde a una necesidad concreta.',items:['Mapeamos el proceso prioritario.','Definimos resultado y criterio de aceptación.','Acordamos un primer entregable utilizable.'],image:'assets/kevin-neon.jpg'},
      {label:'Automatización',title:'Menos tareas. Más capacidad.',copy:'Conectamos fuentes de información y automatizamos pasos repetitivos para que el equipo pueda concentrarse en decisiones y seguimiento.',items:['Flujos documentales y validaciones.','Integraciones con APIs y servicios.','Trazabilidad de cada resultado.'],image:'assets/alejandro-neon.jpg'},
      {label:'Analítica',title:'Datos listos para decidir.',copy:'Preparamos la información y la convertimos en indicadores claros: una vista que permite revisar la operación sin perseguir archivos dispersos.',items:['Indicadores de gestión relevantes.','Reportes con información revisable.','Seguimiento de tiempos y resultados.'],image:'assets/juan-neon.jpg'},
      {label:'Seguridad',title:'Soluciones que se pueden sostener.',copy:'La calidad, la documentación y los controles se incorporan desde el inicio para que la solución sirva hoy y pueda evolucionar después.',items:['Pruebas y revisión antes de entregar.','Documentación para el uso diario.','Acompañamiento durante la adopción.'],image:'assets/kevin-neon.jpg'},
      {label:'Equipo',title:'Capacidades que se complementan.',copy:'Desarrollo, automatización, seguridad y analítica trabajan en una misma conversación para resolver el problema completo, no solo una tarea aislada.',items:['Kevin: backend y seguridad.','Alejandro: integración y automatización.','Juan Diego: analítica y operación.'],image:'assets/juan-neon.jpg'}
    ];
    const deck=document.querySelector('#deck'),area=document.querySelector('#deck-area'),detail=document.querySelector('#detail');let active=0,opened=false;const esc=v=>v.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    function render(){deck.innerHTML=cards.map((card,index)=>`<button class="card ${index===active?'active':''}" data-index="${index}" aria-label="Abrir: ${esc(card.label)}"><img src="${card.image}" alt="Retrato editorial de ${index===0||index===3?'Kevin':index===1?'Alejandro':'Juan Diego'}"><span class="number">0${index+1}</span><span class="copy"><small>0${index+1} · propuesta</small><strong>${esc(card.label)}</strong></span></button>`).join('');deck.querySelectorAll('.card').forEach(card=>{card.addEventListener('mouseenter',()=>setActive(+card.dataset.index));card.addEventListener('click',()=>open(+card.dataset.index));card.addEventListener('focus',()=>setActive(+card.dataset.index))})}
    function setActive(index){active=(index+cards.length)%cards.length;deck.querySelectorAll('.card').forEach((card,i)=>card.classList.toggle('active',i===active))}
    function open(index){active=index;const item=cards[index];document.querySelector('#detail-index').textContent=`0${index+1} / 05 · ${item.label}`;document.querySelector('#detail-title').textContent=item.title;document.querySelector('#detail-copy').textContent=item.copy;document.querySelector('#detail-image').src=item.image;document.querySelector('#detail-image').alt=`Retrato editorial de ${item.label}`;document.querySelector('#detail-list').innerHTML=item.items.map((value,i)=>`<li><i>0${i+1}</i><span>${esc(value)}</span></li>`).join('');detail.classList.add('open');detail.setAttribute('aria-hidden','false');opened=true;document.querySelector('#close').focus()}
    function close(){detail.classList.remove('open');detail.setAttribute('aria-hidden','true');opened=false;deck.querySelector(`[data-index="${active}"]`)?.focus()}
    area.addEventListener('pointermove',event=>{if(matchMedia('(pointer:fine)').matches&&!opened){const rect=area.getBoundingClientRect(),x=(event.clientX-rect.left)/rect.width-.5,y=(event.clientY-rect.top)/rect.height-.5;deck.style.setProperty('--ry',`${x*5}deg`);deck.style.setProperty('--rx',`${-y*3}deg`)}});area.addEventListener('pointerleave',()=>{deck.style.setProperty('--ry','0deg');deck.style.setProperty('--rx','0deg')});document.querySelector('#close').addEventListener('click',close);document.querySelectorAll('[data-nav]').forEach(button=>button.addEventListener('click',()=>open(+button.dataset.nav)));document.addEventListener('keydown',event=>{if(event.key==='Escape'&&opened)close();if(opened&&event.key==='ArrowRight')open((active+1)%cards.length);if(!opened&&event.key==='ArrowRight')setActive(active+1);if(!opened&&event.key==='ArrowLeft')setActive(active-1);if(!opened&&event.key==='Enter')open(active)});render();
  </script>
</body>
</html>
